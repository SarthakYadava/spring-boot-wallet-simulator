spring.application.name=spring-boot-wallet-simulator
server.address=0.0.0.0
server.port=${PORT:8080}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,http://127.0.0.1:3000,https://spring-boot-wallet-simulator.vercel.app}
app.jwt.secret=${JWT_SECRET:wallet-simulator-local-dev-secret-key}
app.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:86400}

# MySQL Database Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/wallet_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Properties
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Console logging
logging.level.root=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level [%X{trackingId}] %logger{36} : %msg%n
kyc.upload.directory=${KYC_UPLOAD_DIRECTORY:uploads/kyc-documents}
